services:
  postgres:
    image: postgres:16-alpine
    container_name: cashier-system-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: restaurant_pos
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos_local_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d restaurant_pos"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
